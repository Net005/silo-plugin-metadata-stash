name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write
env:
  IMAGE_NAME: ghcr.io/net005/silo-plugin-metadata-stash
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify versions and test
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = "v$(python -c 'import json;print(json.load(open("manifest.json"))["version"])')"
          go vet ./...
          go test ./...
          python -m unittest discover -s contrib/stashapp -q
          node --test contrib/stashapp/test_stash_subtitles.js contrib/stashapp/test_stash_scrubber.js
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=semver,pattern={{version}}
            type=raw,value=latest
      - name: Build and publish GHCR image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Package Silo binaries and Stash companion
        shell: bash
        run: |
          mkdir -p dist/companion/stash-metadata
          for target in linux/amd64 linux/arm64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -buildvcs=false -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/silo-plugin-metadata-stash_${GITHUB_REF_NAME}_${os}_${arch}" .
          done
          cp contrib/stashapp/stash-metadata.yml contrib/stashapp/stash_metadata.py contrib/stashapp/stash_features.py contrib/stashapp/stash_subtitles.js contrib/stashapp/stash_subtitles.css contrib/stashapp/stash_scrubber.js contrib/stashapp/stash_scrubber.css dist/companion/stash-metadata/
          (cd dist/companion && zip -r "../stash-metadata-companion_${GITHUB_REF_NAME}.zip" stash-metadata)
          (cd dist && sha256sum silo-plugin-metadata-stash_* stash-metadata-companion_*.zip > SHA256SUMS)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/silo-plugin-metadata-stash_* dist/stash-metadata-companion_*.zip dist/SHA256SUMS --title "Stash.Metadata $GITHUB_REF_NAME" --generate-notes --latest
