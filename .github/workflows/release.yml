name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write
env:
  IMAGE_NAME: ghcr.io/net005/silo-plugin-metadata-stash
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify versions and test
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = "v$(python -c 'import json;print(json.load(open("manifest.json"))["version"])')"
          go vet ./...
          go test ./...
          python -m unittest discover -s contrib/stashapp -q
          node --test contrib/stashapp/test_stash_silo_subtitles.js contrib/stashapp/test_stash_silo_scrubber.js
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=semver,pattern={{version}}
            type=raw,value=latest
      - name: Build and publish GHCR image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Package Silo binaries and Stash companion
        shell: bash
        run: |
          mkdir -p dist/companion/stash-silo-companion
          for target in linux/amd64 linux/arm64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -buildvcs=false -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/silo-plugin-metadata-stash_${GITHUB_REF_NAME}_${os}_${arch}" .
          done
          cp contrib/stashapp/stash-silo-companion.yml contrib/stashapp/stash_silo_companion.py contrib/stashapp/stash_silo_features.py contrib/stashapp/stash_silo_subtitles.js contrib/stashapp/stash_silo_subtitles.css contrib/stashapp/stash_silo_scrubber.js contrib/stashapp/stash_silo_scrubber.css dist/companion/stash-silo-companion/
          (cd dist/companion && zip -r "../stash-silo-companion_${GITHUB_REF_NAME}.zip" stash-silo-companion)
          (cd dist && sha256sum silo-plugin-metadata-stash_* stash-silo-companion_*.zip > SHA256SUMS)
          python scripts/update-stash-source.py --tag "$GITHUB_REF_NAME" --archive "dist/stash-silo-companion_${GITHUB_REF_NAME}.zip" --output dist/stash-plugin-source.yml
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/silo-plugin-metadata-stash_* dist/stash-silo-companion_*.zip dist/SHA256SUMS dist/stash-plugin-source.yml --title "Stash Metadata $GITHUB_REF_NAME" --generate-notes --latest
      - name: Update companion package index for the current release
        shell: bash
        run: |
          git fetch origin main
          current_version="$(git show origin/main:manifest.json | python -c 'import json,sys;print(json.load(sys.stdin)["version"])')"
          if [ "$GITHUB_REF_NAME" != "v$current_version" ]; then
            exit 0
          fi
          git checkout -B publish-companion-index origin/main
          cp dist/stash-plugin-source.yml stash-plugin-source.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add stash-plugin-source.yml
          if ! git diff --cached --quiet; then
            git commit -m "Update companion package checksum for $GITHUB_REF_NAME"
            git push origin HEAD:main
          fi
